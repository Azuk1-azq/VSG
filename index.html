<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSG — Vortex Second Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f7f6ff;
  --card:#ffffff;
  --purple:#7b5ea7;
  --purple-light:#ede9fa;
  --purple-mid:#b49fdc;
  --accent:#ff7eb3;
  --accent-light:#fff0f6;
  --text:#2d2540;
  --muted:#8a82a0;
  --border:#e8e3f5;
  --green:#5dc8a5;
  --green-light:#e8faf4;
  --yellow:#f5c842;
  --yellow-light:#fefae8;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;}

nav{background:var(--card);border-bottom:1.5px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;}
.nav-logo{font-family:'M PLUS Rounded 1c',sans-serif;font-size:22px;font-weight:800;color:var(--purple);letter-spacing:1px;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none;}
.logo-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;display:inline-block;}
.nav-links{display:flex;gap:4px;}
.nav-links a{font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all 0.15s;}
.nav-links a:hover{color:var(--purple);background:var(--purple-light);}
.nav-links a.active{color:var(--purple);background:var(--purple-light);}

.page{display:none;}
.page.active{display:block;animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---- HERO ---- */
.hero{padding:5rem 3rem 3rem;text-align:center;}
.hero-badge{display:inline-block;background:var(--purple-light);color:var(--purple);font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin-bottom:1.2rem;letter-spacing:0.5px;}
.hero h1{font-family:'M PLUS Rounded 1c',sans-serif;font-size:clamp(36px,6vw,60px);font-weight:800;color:var(--text);line-height:1.2;margin-bottom:1rem;}
.hero h1 .highlight{color:var(--purple);}
.hero p{font-size:16px;color:var(--muted);max-width:500px;margin:0 auto 2rem;line-height:1.7;}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.btn-fill{background:var(--purple);color:#fff;border:none;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;padding:12px 24px;border-radius:24px;cursor:pointer;transition:opacity 0.15s,transform 0.1s;}
.btn-fill:hover{opacity:0.85;transform:translateY(-1px);}
.btn-outline{background:var(--card);color:var(--purple);border:2px solid var(--purple);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;padding:12px 24px;border-radius:24px;cursor:pointer;transition:all 0.15s;}
.btn-outline:hover{background:var(--purple-light);transform:translateY(-1px);}
.chips-row{display:flex;gap:10px;justify-content:center;margin-top:2rem;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--text);}
.chip-dot{width:8px;height:8px;border-radius:50%;}

/* ---- SECTIONS ---- */
.section{padding:3rem;}
.section-label{font-size:12px;font-weight:700;color:var(--purple);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.section h2{font-family:'M PLUS Rounded 1c',sans-serif;font-size:28px;font-weight:800;color:var(--text);margin-bottom:1.5rem;}

.vibe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:0.5rem;}
.vibe-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:1.5rem;text-align:center;}
.vibe-num{font-family:'M PLUS Rounded 1c',sans-serif;font-size:36px;font-weight:800;color:var(--purple);}
.vibe-label{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px;}

.activity-list{display:flex;flex-direction:column;gap:12px;}
.activity-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:1.2rem 1.5rem;display:flex;align-items:flex-start;gap:14px;transition:border-color 0.15s,transform 0.15s;}
.activity-card:hover{border-color:var(--purple-mid);transform:translateY(-2px);}
.act-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.act-icon.purple{background:var(--purple-light);color:var(--purple);}
.act-icon.pink{background:var(--accent-light);color:var(--accent);}
.act-icon.green{background:var(--green-light);color:var(--green);}
.act-body{flex:1;}
.act-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;}
.act-desc{font-size:13px;color:var(--muted);line-height:1.6;}
.act-date{font-size:12px;font-weight:600;color:var(--muted);margin-top:6px;}
.act-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;margin-left:8px;}
.tag-new{background:var(--accent-light);color:var(--accent);}
.tag-event{background:var(--purple-light);color:var(--purple);}
.tag-fun{background:var(--yellow-light);color:#a37c00;}

/* ---- ABOUT ---- */
.about-hero{padding:5rem 3rem 2rem;text-align:center;}
.about-hero h1{font-family:'M PLUS Rounded 1c',sans-serif;font-size:clamp(32px,5vw,52px);font-weight:800;color:var(--text);margin-bottom:1rem;line-height:1.2;}
.about-hero h1 span{color:var(--purple);}
.about-hero p{font-size:15px;color:var(--muted);max-width:500px;margin:0 auto;line-height:1.8;}

.about-cards{padding:2rem 3rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
.about-card{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:2rem;transition:border-color 0.15s
